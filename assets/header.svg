  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .role { opacity: 0; animation: role 12s ease-in-out infinite; }
    .r1 { opacity: 1; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .r4 { animation-delay: 9s; }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(10px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 0.35; transform: scale(1.2); } }
    @media (prefers-reduced-motion: reduce) {
      .role, .pulse { animation: none; }
    }
  </style>

