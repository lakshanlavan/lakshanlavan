<svg xmlns="http://www.w3.org/2000/svg" width="272" height="58" viewBox="0 0 272 58" role="img" aria-label="Portfolio: lakshanlavan.github.io">
  <title>Portfolio: lakshanlavan.github.io</title>
  <defs>
    <linearGradient id="portfolio-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="portfolio-rim" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.45" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="portfolio-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="portfolio-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="portfolio-clip"><rect x="1" y="1" width="270" height="56" rx="15"/></clipPath>
  </defs>
  <rect x="1" y="1" width="270" height="56" rx="15" fill="url(#portfolio-bg)"/>
  <g clip-path="url(#portfolio-clip)">
    <rect x="-90" y="-10" width="70" height="78" fill="url(#portfolio-shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;412 0;412 0" keyTimes="0;0.3;1" dur="5s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="270" height="56" rx="15" fill="none" stroke="url(#portfolio-rim)" stroke-width="1.5"/>
  <rect x="10.0" y="10.0" width="38" height="38" rx="11" fill="url(#portfolio-tile)"/>
  <rect x="10.0" y="10.0" width="38" height="19.0" rx="11" fill="#fff" opacity="0.12"/>
  <g transform="translate(29.0 29.0)"><g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"><circle r="8.5"/><ellipse rx="3.6" ry="8.5"/><path d="M-8.5 0H8.5M-7.4-4.2H7.4M-7.4 4.2H7.4"/></g></g>
  <text x="60.0" y="24.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.3" fill="#8b949e">PORTFOLIO</text>
  <text x="60.0" y="41.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">lakshanlavan.github.io</text>
  <g transform="translate(248 29.0)">
    <circle r="11" fill="#059669" fill-opacity="0.14"/>
    <path d="M-3.2 3.2 3.2-3.2M-2.2-3.4H3.4V2.2" fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
