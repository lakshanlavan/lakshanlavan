<svg xmlns="http://www.w3.org/2000/svg" width="318" height="58" viewBox="0 0 318 58" role="img" aria-label="Email: lakshan.l.robotics@gmail.com">
  <title>Email: lakshan.l.robotics@gmail.com</title>
  <defs>
    <linearGradient id="email-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="email-rim" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ff6b5b"/>
      <stop offset="0.45" stop-color="#30363d"/>
      <stop offset="1" stop-color="#30363d"/>
      <animate attributeName="x1" values="0;-0.6;0" dur="6s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.4;1" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="email-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b5b"/><stop offset="1" stop-color="#d93025"/>
    </linearGradient>
    <linearGradient id="email-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="email-clip"><rect x="1" y="1" width="316" height="56" rx="15"/></clipPath>
  </defs>
  <rect x="1" y="1" width="316" height="56" rx="15" fill="url(#email-bg)"/>
  <g clip-path="url(#email-clip)">
    <rect x="-90" y="-10" width="70" height="78" fill="url(#email-shine)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;458 0;458 0" keyTimes="0;0.3;1" dur="5s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="316" height="56" rx="15" fill="none" stroke="url(#email-rim)" stroke-width="1.5"/>
  <rect x="10.0" y="10.0" width="38" height="38" rx="11" fill="url(#email-tile)"/>
  <rect x="10.0" y="10.0" width="38" height="19.0" rx="11" fill="#fff" opacity="0.12"/>
  <g transform="translate(29.0 29.0)"><g fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="-8.5" y="-6.5" width="17" height="13" rx="2.6"/><path d="M-7.6-4.8 0 1 7.6-4.8"/></g></g>
